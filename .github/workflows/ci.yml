name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run tests
        run: uv run --with pytest pytest -q

      - name: Smoke-test agent installer
        if: matrix.python-version == '3.13'
        run: |
          single_root="$(mktemp -d)"
          mkdir -p "$single_root/user/.codex"
          VIBEMIN_SKIP_COMMAND_DETECTION=1 VIBEMIN_SKIP_CLI_INSTALL=1 \
            VIBEMIN_USER_HOME="$single_root/user" XDG_DATA_HOME="$single_root/data" \
            ./scripts/install-user.sh
          test -f "$single_root/user/.agents/skills/vibemin/SKILL.md"
          test ! -e "$single_root/user/.claude/skills/vibemin/SKILL.md"

          choice_root="$(mktemp -d)"
          mkdir -p "$choice_root/user/.claude" "$choice_root/user/.codex"
          printf 'claude\n' | VIBEMIN_FORCE_INTERACTIVE=1 \
            VIBEMIN_SKIP_COMMAND_DETECTION=1 VIBEMIN_SKIP_CLI_INSTALL=1 \
            VIBEMIN_USER_HOME="$choice_root/user" XDG_DATA_HOME="$choice_root/data" \
            ./scripts/install-user.sh
          test -f "$choice_root/user/.claude/skills/vibemin/SKILL.md"
          test ! -e "$choice_root/user/.agents/skills/vibemin/SKILL.md"

          multi_root="$(mktemp -d)"
          mkdir -p "$multi_root/user/.claude" "$multi_root/user/.gemini"
          VIBEMIN_SKIP_COMMAND_DETECTION=1 VIBEMIN_SKIP_CLI_INSTALL=1 \
            VIBEMIN_USER_HOME="$multi_root/user" XDG_DATA_HOME="$multi_root/data" \
            ./scripts/install-user.sh < /dev/null
          test -f "$multi_root/user/.claude/skills/vibemin/SKILL.md"
          test -f "$multi_root/user/.agents/skills/vibemin/SKILL.md"

          standalone_root="$(mktemp -d)"
          VIBEMIN_SKIP_COMMAND_DETECTION=1 VIBEMIN_SKIP_CLI_INSTALL=1 \
            VIBEMIN_USER_HOME="$standalone_root/user" XDG_DATA_HOME="$standalone_root/data" \
            ./scripts/install-user.sh
          test ! -e "$standalone_root/user/.agents"
          test ! -e "$standalone_root/user/.claude"

          absent_root="$(mktemp -d)"
          VIBEMIN_SKIP_COMMAND_DETECTION=1 VIBEMIN_SKIP_CLI_INSTALL=1 \
            VIBEMIN_USER_HOME="$absent_root/user" XDG_DATA_HOME="$absent_root/data" \
            ./scripts/install-user.sh --agent gemini
          test -f "$absent_root/user/.agents/skills/vibemin/SKILL.md"

          bootstrap_root="$(mktemp -d)"
          mkdir -p "$bootstrap_root/user/.codex"
          printf '# Existing Codex instructions\n' > "$bootstrap_root/user/.codex/AGENTS.md"
          VIBEMIN_SKIP_BINARY_INSTALL=1 VIBEMIN_SKIP_COMMAND_DETECTION=1 \
            VIBEMIN_SOURCE_BASE_URL="file://$GITHUB_WORKSPACE" \
            VIBEMIN_USER_HOME="$bootstrap_root/user" \
            ./scripts/install-agent.sh --everything
          VIBEMIN_SKIP_BINARY_INSTALL=1 VIBEMIN_SKIP_COMMAND_DETECTION=1 \
            VIBEMIN_SOURCE_BASE_URL="file://$GITHUB_WORKSPACE" \
            VIBEMIN_USER_HOME="$bootstrap_root/user" \
            ./scripts/install-agent.sh --everything
          test -f "$bootstrap_root/user/.agents/skills/vibemin/SKILL.md"
          grep -q '# Existing Codex instructions' "$bootstrap_root/user/.codex/AGENTS.md"
          test "$(grep -c 'vibemin:feature-completion' \
            "$bootstrap_root/user/.codex/AGENTS.md")" -eq 1

      - name: Check style and build
        if: matrix.python-version == '3.13'
        run: |
          uv run --with ruff ruff check .
          uv run --with ruff ruff format --check .
          uv build
