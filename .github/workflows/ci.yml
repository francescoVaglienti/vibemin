name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run tests
        run: uv run --with pytest pytest -q

      - name: Smoke-test agent installer
        if: matrix.python-version == '3.13'
        run: |
          install_root="$(mktemp -d)"
          VIBEMIN_USER_HOME="$install_root/user" XDG_DATA_HOME="$install_root/data" \
            ./scripts/install-user.sh
          test -f "$install_root/user/.claude/skills/vibemin/SKILL.md"
          test -f "$install_root/user/.agents/skills/vibemin/SKILL.md"

      - name: Check style and build
        if: matrix.python-version == '3.13'
        run: |
          uv run --with ruff ruff check .
          uv run --with ruff ruff format --check .
          uv build
